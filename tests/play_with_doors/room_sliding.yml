  - type: room
    label: "All doors options"
    vars:
      door_spacing: 0.6         # Each balcony_door and window going to be spaced out by this distance
                                # When using in project, set the anchor point of a balcony_door
                                # according to your need.
      doorway_width: 1.14
      door_width: 0.9
      window_width: 1.4

      anchor_x: x_placement_sliding
      anchor_y: y_placement_sliding
      room_length: room_horizontal_length
      room_width: room_vertical_width
      wall_n_thickness: 0.36
      wall_e_thickness: 0.12
      wall_s_thickness: 0.24
      wall_w_thickness: 0.30

    anchor_point: [anchor_x,anchor_y]

    elements:
    # Edge walls
      - type: wall
        anchor_point: [0, 0]
        length: room_width
        thickness: wall_s_thickness
        color: black
        orientation_angle: 0
        room_edge: true
        label: "South wall"
      - type: wall
        anchor_point: [room_width, 0]
        length: room_length
        thickness: wall_e_thickness
        orientation_angle: 90
        color: black
        room_edge: true
        label: "East wall"
      - type: wall
        anchor_point: [room_width, room_length]
        length: room_width
        thickness: wall_n_thickness
        orientation_angle: 180
        color: black
        room_edge: true
        label: "North wall"
      - type: wall
        anchor_point: [0, room_length]
        length: room_length
        thickness: wall_w_thickness
        color: black
        orientation_angle: 270
        room_edge: true
        label: "West wall"
      - type: hipped_roof
        anchor_point: [-0.8, -0.8]
        size: [room_width + 2*0.8, room_length + 2*0.8]
        height: 3.0

    # Doors and south wall
      - type: model_balcony_door
        door_type: sliding
        anchor_point: [door_spacing, 0]
        doorway_width: doorway_width
        door_width: door_width
        thickness: wall_s_thickness
        orientation_angle: 0
        to_the_right: false
        hinges_point: 0 #  How far hinges are related to swing of balcony_door.
        opening_outside: false
        label: "south sliding_door l inside"
        color: brown
      - type: model_balcony_door
        door_type: sliding
        anchor_point: [door_spacing + (door_spacing+doorway_width)*1, 0]
        doorway_width: doorway_width
        door_width: door_width
        thickness: wall_s_thickness
        orientation_angle: 0
        to_the_right: true
        hinges_point: 1 #  How far hinges are related to swing of balcony_door.
        opening_outside: false
        label: "south sliding_door r inside"
        color: brown
      - type: model_balcony_door
        door_type: sliding
        anchor_point: [door_spacing + (door_spacing+doorway_width)*2, 0]
        doorway_width: doorway_width
        door_width: door_width
        thickness: wall_s_thickness
        orientation_angle: 0
        to_the_right: false
        hinges_point: 0 #  How far hinges are related to swing of balcony_door.
        opening_outside: true
        label: "south sliding_door l outside"
        color: brown
      - type: model_balcony_door
        door_type: sliding
        anchor_point: [door_spacing + (door_spacing+doorway_width)*3, 0]
        doorway_width: doorway_width
        door_width: door_width
        thickness: wall_s_thickness
        orientation_angle: 0
        to_the_right: true
        hinges_point: 1 #  How far hinges are related to swing of balcony_door.
        opening_outside: true
        label: "south sliding_door r outside"
        color: brown
      - type: model_window_single_any
        anchor_point: [door_spacing + (door_spacing+doorway_width)*4,0]
        length: window_width
        height: 1.1
        overall_thickness: wall_s_thickness
        orientation_angle: 0
        label: "South window"
    # Doors and windows north wall
      - type: model_balcony_door
        door_type: sliding
        anchor_point: [doorway_width + door_spacing, room_length]
        doorway_width: doorway_width
        door_width: door_width
        thickness: wall_n_thickness
        orientation_angle: 180
        to_the_right: true
        hinges_point: 1.4 #  How far hinges are related to swing of balcony_door.
        opening_outside: false
        label: "north sliding_door r inside"
        color: brown
      - type: model_balcony_door
        door_type: sliding
        anchor_point: [doorway_width + door_spacing + (door_spacing+doorway_width)*1, room_length]
        doorway_width: doorway_width
        door_width: door_width
        thickness: wall_n_thickness
        orientation_angle: 180
        to_the_right: false
        hinges_point: 1.4 #  How far hinges are related to swing of balcony_door.
        opening_outside: false
        label: "north sliding_door l inside"
        color: brown
      - type: model_balcony_door
        door_type: sliding
        anchor_point: [doorway_width + door_spacing + (door_spacing+doorway_width)*2, room_length]
        doorway_width: doorway_width
        door_width: door_width
        thickness: wall_n_thickness
        orientation_angle: 180
        to_the_right: true
        hinges_point: 1.4 #  How far hinges are related to swing of balcony_door.
        opening_outside: true
        label: "north sliding_door r outside"
        color: brown
      - type: model_balcony_door
        door_type: sliding
        anchor_point: [doorway_width + door_spacing + (door_spacing+doorway_width)*3, room_length]
        doorway_width: doorway_width
        door_width: door_width
        thickness: wall_n_thickness
        orientation_angle: 180
        to_the_right: false
        hinges_point: 1.4 #  How far hinges are related to swing of balcony_door.
        opening_outside: true
        label: "north sliding_door l outside"
        color: brown
      - type: window
        length: window_width
        anchor_point: [window_width + door_spacing + (door_spacing+doorway_width)*4, room_length]
        length: window_width
        overall_thickness: wall_n_thickness
        orientation_angle: 180
        label: "north window"
    # Doors and windows west wall
      - type: model_balcony_door
        door_type: sliding
        anchor_point: [0, door_spacing + doorway_width]
        doorway_width: doorway_width
        door_width: door_width
        thickness: wall_w_thickness
        orientation_angle: 270
        to_the_right: true
        hinges_point: 1.4 #  How far hinges are related to swing of balcony_door.
        opening_outside: true
        label: "west r sliding_door outside"
        color: black
      - type: model_balcony_door
        door_type: sliding
        anchor_point: [0, door_spacing + doorway_width +  (door_spacing+doorway_width)*1]
        doorway_width: doorway_width
        door_width: door_width
        thickness: wall_w_thickness
        orientation_angle: 270
        to_the_right: false
        hinges_point: -0.4 #  How far hinges are related to swing of balcony_door.
        opening_outside: true
        label: "west l sliding_door outside"
        color: black
      - type: model_balcony_door
        door_type: sliding
        anchor_point: [0, door_spacing + doorway_width +  (door_spacing+doorway_width)*2]
        doorway_width: doorway_width
        door_width: door_width
        thickness: wall_w_thickness
        orientation_angle: 270
        to_the_right: true
        hinges_point: 0.95 #  How far hinges are related to swing of balcony_door.
        opening_outside: false
        label: "west r sliding_door inside"
        color: black
      - type: model_balcony_door
        door_type: sliding
        anchor_point: [0, door_spacing + doorway_width +  (door_spacing+doorway_width)*3]
        doorway_width: doorway_width
        door_width: door_width
        thickness: wall_w_thickness
        orientation_angle: 270
        to_the_right: false
        hinges_point: 0.95 #  How far hinges are related to swing of balcony_door.
        opening_outside: false
        label: "west l sliding_door inside"
        color: black
      - type: window
        length: window_width
        anchor_point: [0, door_spacing + window_width +  (door_spacing+doorway_width)*4]
        length: window_width
        overall_thickness: wall_w_thickness
        orientation_angle: 270
        label: "west window"
    # Doors and windows east wall
      - type: model_balcony_door
        door_type: sliding
        anchor_point: [room_width , door_spacing ]
        doorway_width: doorway_width
        door_width: door_width
        thickness: wall_e_thickness
        orientation_angle: 90
        to_the_right: false
        hinges_point: 0.95 #  How far hinges are related to swing of balcony_door.
        opening_outside: false
        label: "east l sliding_door inside"
        color: black
      - type: model_balcony_door
        door_type: sliding
        anchor_point: [room_width , door_spacing + (door_spacing+doorway_width)*1]
        doorway_width: doorway_width
        door_width: door_width
        thickness: wall_e_thickness
        orientation_angle: 90
        to_the_right: true
        hinges_point: 0.95 #  How far hinges are related to swing of balcony_door.
        opening_outside: false
        label: "east r sliding_door inside"
        color: black
      - type: model_balcony_door
        door_type: sliding
        anchor_point: [room_width , door_spacing + (door_spacing+doorway_width)*2]
        doorway_width: doorway_width
        door_width: door_width
        thickness: wall_e_thickness
        orientation_angle: 90
        to_the_right: false
        hinges_point: 0.95 #  How far hinges are related to swing of balcony_door.
        opening_outside: true
        label: "east l sliding_door outside"
        color: black
      - type: model_balcony_door
        door_type: sliding
        anchor_point: [room_width , door_spacing + (door_spacing+doorway_width)*3]
        doorway_width: doorway_width
        door_width: door_width
        thickness: wall_e_thickness
        orientation_angle: 90
        to_the_right: true
        hinges_point: 0.95 #  How far hinges are related to swing of balcony_door.
        opening_outside: true
        label: "east r sliding_door outside"
        color: black
      - type: window
        length: window_width
        anchor_point: [room_width,door_spacing + (door_spacing+doorway_width)*4]
        length: window_width
        overall_thickness: wall_e_thickness
        orientation_angle: 90
        label: "east window"