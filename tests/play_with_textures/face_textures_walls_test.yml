# Fine-grained textures for boxes (per-face textures, scale, lighting, opacity)
# See docs/features/fine-grained-textures-for-boxes.md and the `textures`
# parameter in docs/element-parameters-reference.md.

project:
  dpi: 100
  pdf_file: null
  png_dir: "output"
  visualisation_dir: "output/3d"  # Enable 3D glTF export

default_layout:
  bottom_left_corner: [-1, 1]
  top_right_corner: [19, 16]
  scale_numerator: 1
  scale_denominator: 50
  grid_major_step: 1
  grid_minor_step: 0.1

vars:
  szklo: transparent/shower-plain.png
  szklo2: transparent/green-glass-tile.png
  szklo3: special/wither3_scene.jpg     # from jpeg w/o alpha channel

floor_plans:
  - title:
      text: "textures_walls_test"
      font_size: 18
    options:
      Wall:
        label_color: "#F02020"
    elements:
    
    # Test interior texturing on solid wall without a window (invisible window, just cut opening)
      - type: wall
        anchor_point: [0, 2]
        orientation_angle: 0
        length: 3.5
        thickness: 0.5
        textures:
          left:   {texture: plain_named/beige-stone-path.jpg}
          front:  {texture: plain_named/blue-pool-water.jpg}
          right:  {texture: plain_named/brown-lighter-wood-sliding-door.jpg}
          back:   {texture: plain_named/dark-gray-black-stove.jpg}
          top:    {texture: plain_named/cyan-fountain-water.jpg}
          bottom: {texture: plain_named/ping-flower-bed.jpg}
          extras:
            inside_left:   {texture: special/wither3_scene.jpg, scale_relative: 6}
            inside_right:  {texture: special/wither3_scene.jpg}
            inside_top:    {texture: paving/flat-limestone.jpg}
            inside_bottom: {texture: paving/small-pebbles.jpg, scale_meters: 0.5}  
        label: solid_wall_test_interior_texturing
      - type: window
        anchor_point: [1.50, 2]
        length: 1
        overall_thickness: 0.5
        orientation_angle: 0
        color: invisible

    # Test glass wall without a window (invisible window, just cut opening)
      - type: wall
        anchor_point: [0, 5]
        orientation_angle: 0
        length: 3.5
        thickness: 0.5
        textures:
          default:   
            texture: "{szklo}"
            opacity: 0.1
        label: glass_wall_with_opening
      - type: window
        anchor_point: [1.50, 5]
        length: 2
        overall_thickness: 0.5
        orientation_angle: 0
        color: invisible
    
    # Test glass wall without a window (invisible window, just cut opening) double sided
      - type: wall
        anchor_point: [0, 10]
        orientation_angle: 0
        length: 3.5
        thickness: 0.5
        textures:
          default:   
            texture: "{szklo}"
            opacity: 0.1
            double_sided: true
        label: glass_wall_with_opening_double_sided
      - type: window
        anchor_point: [1.50, 10]
        length: 2
        overall_thickness: 0.5
        orientation_angle: 0
        color: invisible

    # Default textured wall, just to look on it
      - type: wall
        anchor_point: [4, 5]
        orientation_angle: 0
        length: 4.0
        thickness: 0.1
        textures:
          default:   {texture:  special/wither3_scene.jpg}
        label: textured_wall

    # Default textured wall, with opening, test tiling
      - type: wall
        anchor_point: [4, 13]
        orientation_angle: 0
        length: 4.0
        thickness: 0.4
        textures:
          default:   
            texture:  special/wither3_scene.jpg
            scale_meters: 0.2
        label: textured_tiled_wall_with_opening
      - type: window
        anchor_point: [6, 13]
        length: 1
        overall_thickness: 0.4
        orientation_angle: 0
        color: invisible

    # Glass wall wit opacity 0.4 and window in it
      - type: wall
        anchor_point: [4, 9]
        orientation_angle: 0
        length: 4.0
        thickness: 1
        textures:
          default:   
            texture: "{szklo}"
            opacity: 0.4
        label: glass_wall_op04
      - type: window
        anchor_point: [5, 9]
        length: 1
        overall_thickness: 1
        orientation_angle: 0
        color: black
    
    # Glass wall with opacity 0.95 and window in it
      - type: wall
        anchor_point: [4, 14]
        orientation_angle: 0
        length: 4.0
        thickness: 0.2
        textures:
          default:   
            texture: "{szklo}"
            scale_meters: 0.25
            opacity: 0.95
        label: glass_wall_op095

    # Green tiled wall with opacity 0.1
      - type: wall
        anchor_point: [9, 2]
        orientation_angle: 0
        length: 4.0
        thickness: 1
        textures:
          default:   
            texture: "{szklo2}"
            scale_meters: 0.5
            opacity: 0.1
        label: green_tiles_op01
        
    # Green tiled wall with opacity 0.5
      - type: wall
        anchor_point: [9, 6]
        orientation_angle: 0
        length: 4.0
        thickness: 1
        textures:
          default:   
            texture: "{szklo2}"
            scale_meters: 0.5
            opacity: 0.5
        label: green_tiles_op05

    # Tiled wall with opacity 0.9 and double sided textures
      - type: wall
        anchor_point: [9, 10]
        orientation_angle: 0
        length: 4.0
        thickness: 1
        textures:
          default:   
            texture: "{szklo2}"
            scale_meters: 0.5
            opacity: 0.9
            double_sided: true
        label: green_tiles_op09_double_sided

    # Tiled wall with opacity 0.1 using jpeg as texture
      - type: wall
        anchor_point: [13.5, 2]
        orientation_angle: 0
        length: 4.0
        thickness: 1
        textures:
          default:   
            texture: "{szklo3}"
            scale_meters: 0.5
            opacity: 0.1
        label: jpeg_tiles_op01

    # Tiled wall with opacity 0.5 using jpeg as texture
      - type: wall
        anchor_point: [13.5, 6]
        orientation_angle: 0
        length: 4.0
        thickness: 1
        textures:
          default:   
            texture: "{szklo3}"
            scale_meters: 0.5
            opacity: 0.5
        label: jpeg_tiles_op05
      
    # Tiled wall with opacity 0.9 using jpeg as texture, single sided
      - type: wall
        anchor_point: [13.5, 10]
        orientation_angle: 0
        length: 2.0
        thickness: 1
        textures:
          default:   
            texture: "{szklo3}"
            scale_meters: 1
            opacity: 0.9
            double_sided: false
        label: jpeg_tiles_op09

    # Tiled wall with opacity 0.9 using jpeg as texture, double sided
      - type: wall
        anchor_point: [16, 10]
        orientation_angle: 0
        length: 2.0
        thickness: 1
        textures:
          default:   
            texture: "{szklo3}"
            scale_meters: 1
            opacity: 0.9
            double_sided: true
        label: jpeg_tiles_op09_double_sided
