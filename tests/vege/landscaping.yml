# Shrub  ⌀ 1.5 m, centre anchor
- type: shrub
  anchor_point: [8.0, 4.0]
  diameter: 1.5
  height: 1.2
  color: '#7DB870'
  label: "shrub"

# Hedge  2.5 × 0.5 m, corner anchor
- type: hedge
  anchor_point: [12.0, 4.0]
  length: 2.5
  thickness: 0.5
  height: 1.5
  orientation_angle: 0
  color: '#556B2F'
  label: "hedge"

# Lawn  2.5 × 1.5 m, corner anchor
- type: lawn
  anchor_point: [4.0, 4.0]
  x_axis_size: 1.5
  z_axis_size: 1.5
  orientation_angle: 0
  color: '#7CFC00'
  label: "lawn"
