  - type: room
    label: "Test placement of external model chair in room"
    vars:
      door_placement_from_bottom: 0.5
      window_placement_from_bottom: 0.7
      doorway_width: 1.0
      door_width: 0.9
      window_width: 1.5
      
      chair_anchor_x_offset: 1.5

      anchor_x: x_placement
      anchor_y: y_placement
      room_length: room_horizontal_length
      room_width: room_vertical_width
      wall_thickness: wall_thickness
 
    anchor_point: [anchor_x, anchor_y]

    elements:
    # Edge walls (invisible, so they do not obstruct the view of the chairs)
      - type: wall
        id: wall_south
        anchor_point: [0, 0]
        length: room_width
        thickness: wall_thickness
        color: invisible
        orientation_angle: 0
        room_edge: true

      - type: wall
        id: wall_east
        anchor_point: [room_width, 0]
        length: room_length
        thickness: wall_thickness
        orientation_angle: 90
        color: invisible
        room_edge: true
      
      - type: wall
        id: wall_north
        anchor_point: [room_width, room_length]
        length: room_width
        thickness: wall_thickness
        orientation_angle: 180
        color: invisible
        room_edge: true
      
      - type: wall
        id: wall_west
        anchor_point: [0, room_length]
        length: room_length
        thickness: wall_thickness
        color: invisible
        orientation_angle: 270
        room_edge: true

    # Will use a generic storage as a reference point for chair placement

    # at 0,0      
      - type: generic_storage
        anchor_point: [0, 0]
        orientation_angle: 0
        length: 0.5
        thickness: 0.2
        height: 0.1
        v_anchor: 0.0
        color: brown
        label: "storage 0.5x0.2x0.1"
    # chair at 0,0. looking at XZ plane (downwards Y plane) the bottom left corner
    # of the chair should match up with the bottom left corner of the storage
      - type: wooden_chair
        anchor_point: [0,0]
        orientation_angle: 0
        color: brown
        label: "Wooden Chair"

    # shifted x,y without rotation, 
      - type: generic_storage
        anchor_point: [2, 1]
        orientation_angle: 0
        length: 0.5
        thickness: 0.2
        height: 0.1
        color: brown
        label: "storage 0.5x0.2x0.1"
      - type: wooden_chair
        anchor_point: [2,1]
        orientation_angle: 0
        color: brown
        label: "Wooden Chair"

    # shifted x,y with rotation 90
      - type: generic_storage
        anchor_point: [4, 3]
        orientation_angle: 90
        length: 0.5
        thickness: 0.2
        height: 0.1
        color: brown
        label: "storage 0.5x0.2x0.1"
      - type: wooden_chair
        anchor_point: [4,3]
        orientation_angle: 90
        color: brown
        label: "Wooden Chair"

      # shifted x,y with rotation 180
      - type: generic_storage
        anchor_point: [2, 5]
        orientation_angle: 180
        length: 0.5
        thickness: 0.2
        height: 0.1
        color: brown
        label: "storage 0.5x0.2x0.1"
      - type: wooden_chair
        anchor_point: [2,5]
        orientation_angle: 180
        color: brown
        label: "Wooden Chair"

      # shifted x,y with rotation 270
      - type: generic_storage
        anchor_point: [2, 7]
        orientation_angle: 270
        length: 0.5
        thickness: 0.2
        height: 0.1
        color: brown
        label: "storage 0.5x0.2x0.1"
      - type: wooden_chair
        anchor_point: [2,7]
        orientation_angle: 270
        color: brown
        label: "Wooden Chair"