project:
  dpi: 150
  file: examples/external_model_test.pdf

default_layout:
  bottom_left_corner: [0, 0]
  top_right_corner: [5, 5]
  scale_numerator: 1
  scale_denominator: 50

default_options:
  label_color: black
  auto_dimensions: false

floor_plans:
  - title:
      text: "External Model Test"
      font_size: 18
    elements:
      # Simple wall for reference
      - type: wall
        id: wall_001
        anchor_point: [0, 0]
        length: 5
        thickness: 0.2
        height: 2.8
        orientation_angle: 0
      
      # Test element without external model (should use procedural 2D rendering)
      - type: external_model_test
        id: test_001
        anchor_point: [1, 1]
        orientation_angle: 0
        label: "Test 1"
      
      # Test element at different position and rotation
      - type: external_model_test
        id: test_002
        anchor_point: [3, 2]
        orientation_angle: 45
        label: "Test 2"
      
      # Test element with custom color
      - type: external_model_test
        id: test_003
        anchor_point: [2, 3.5]
        orientation_angle: 90
        color: [100, 150, 200]
        label: "Test 3"
