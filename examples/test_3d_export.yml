# Test 3D OBJ/MTL export with visualisation_dir
# Simple floor plan with a few elements to test 3D generation

project:
  dpi: 200
  pdf_file: null
  png_dir: "."
  visualisation_dir: "visualisation_3d"  # Enable 3D export

default_layout:
  bottom_left_corner: [0, 0]
  top_right_corner: [10, 10]
  scale_numerator: 1
  scale_denominator: 50
  grid_major_step: 1
  grid_minor_step: 0.1

floor_plans:
  - title:
      text: "Test 3D Export"
      font_size: 18
    elements:
      # Simple room outline with walls
      - type: wall
        anchor_point: [0, 0]
        orientation_angle: 0
        length: 5
        thickness: 0.2
        color: gray
        
      # Window in the wall (should protrude to prevent z-fighting)
      - type: window
        anchor_point: [1.5, 0]
        orientation_angle: 0
        length: 1.2
        overall_thickness: 0.2
        color: lightblue
