project:
  dpi: 150
  file: examples/wooden_chair_test.png

default_layout:
  bottom_left_corner: [0, 0]
  top_right_corner: [8, 6]
  scale_numerator: 1
  scale_denominator: 50

default_options:
  label_color: black
  auto_dimensions: false

floor_plans:
  - title:
      text: "Wooden Chair Test - External 3D Model"
      font_size: 18
    elements:
      # Reference wall for scale
      - type: wall
        id: wall_001
        anchor_point: [1, 1]
        length: 6
        thickness: 0.2
        orientation_angle: 0
      
      # Wooden chairs with external model
      - type: wooden_chair
        id: chair_001
        anchor_point: [2, 3]
        orientation_angle: 0
        label: "Chair 0°"
      
      - type: wooden_chair
        id: chair_002
        anchor_point: [4, 3]
        orientation_angle: 45
        label: "Chair 45°"
      
      - type: wooden_chair
        id: chair_003
        anchor_point: [6, 3]
        orientation_angle: 90
        label: "Chair 90°"
      
      # External model test for comparison
      - type: external_model_test
        id: test_001
        anchor_point: [2, 5]
        label: "Test Element"
