# Simple 3D Visualization Example
# A basic room with walls, door, window and furniture

project:
  dpi: 200
  pdf_file: null
  png_dir: "."
  visualisation_dir: "visualisation_3d"  # Enable 3D glTF export

default_layout: 
  bottom_left_corner: [0, 0]
  top_right_corner: [8, 6]
  scale_numerator: 1
  scale_denominator: 50
  grid_major_step: 1
  grid_minor_step: 0.1

floor_plans:
  - title:
      text: "Simple Room - 3D Export Demo"
      font_size: 18
    
    elements:
      # Room walls (4m x 3m)
      - type: wall
        anchor_point: [0, 0]
        orientation_angle: 0
        length: 4
        thickness: 0.15
        color: invisible
      
      - type: wall
        anchor_point: [4, 0]
        orientation_angle: 90
        length: 3
        thickness: 0.15
        color: invisible
      
      - type: wall
        anchor_point: [4, 3]
        orientation_angle: 180
        length: 4
        thickness: 0.15
        color: invisible
      
      - type: wall
        anchor_point: [0, 3]
        orientation_angle: 270
        length: 3
        thickness: 0.15
        color: gray
      
      # Door
      - type: door
        anchor_point: [0.5, 0]
        orientation_angle: 0
        doorway_width: 1.0
        door_width: 0.9
        thickness: 0.15
        to_the_right: false
        color: brown
      
      # Window
      - type: window
        anchor_point: [1.5, 3]
        orientation_angle: 180
        length: 1.5
        overall_thickness: 0.15
        single_line_thickness: 0.02
        color: lightblue
      
  