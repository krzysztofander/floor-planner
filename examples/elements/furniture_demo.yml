project:
  dpi: 200
  pdf_file: null
  png_dir: "."
default_options:
  Wall:
    label_color: gray
    dimensions: false
default_layout:
  bottom_left_corner: [0, 0]
  top_right_corner: [10, 12]
  scale_numerator: 1
  scale_denominator: 50
  grid_major_step: 1.0
  grid_minor_step: 0.5
reusable_elements:
  beds_elements:
    # Title
    - type: text_box
      anchor_point: [0.5, 5.5]
      lines:
        - "Beds - Rotation Test"
        - "Each row shows: 0°, 90°, 180°, 270°"
      transparency: 0.0
      
    # Row 1: Double Bed
    - type: text_box
      anchor_point: [0.2, 4.5]
      lines:
        - "Double Bed"
      transparency: 0.0
    - type: double_bed
      anchor_point: [1.5, 4.0]
      orientation_angle: 0
      color: blue
      label: "0°"
    - type: double_bed
      anchor_point: [3.5, 4.0]
      orientation_angle: 90
      color: blue
      label: "90°"
    - type: double_bed
      anchor_point: [5.5, 4.0]
      orientation_angle: 180
      color: blue
      label: "180°"
    - type: double_bed
      anchor_point: [7.5, 4.0]
      orientation_angle: 270
      color: blue
      label: "270°"
      
    # Row 2: Single Bed
    - type: text_box
      anchor_point: [0.2, 2.0]
      lines:
        - "Single Bed"
      transparency: 0.0
    - type: single_bed
      anchor_point: [1.5, 1.5]
      orientation_angle: 0
      color: lightblue
      label: "0°"
    - type: single_bed
      anchor_point: [3.5, 1.5]
      orientation_angle: 90
      color: lightblue
      label: "90°"
    - type: single_bed
      anchor_point: [5.5, 1.5]
      orientation_angle: 180
      color: lightblue
      label: "180°"
    - type: single_bed
      anchor_point: [7.5, 1.5]
      orientation_angle: 270
      color: lightblue
      label: "270°"
  
